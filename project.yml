name: SmartBlanketPro
options:
  bundleIdPrefix: com.jinghe.smartblanket
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SmartBlanketPro:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 智能电热毯
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSBluetoothAlwaysUsageDescription: "需要使用蓝牙扫描并直连控制您的晶合物联智能电热毯，实现极速开关、双温区调挡、定时与快捷指令自动化。"
        NSBluetoothPeripheralUsageDescription: "需要使用蓝牙连接您的智能电热毯以同步实时温度、挡位和开启时长。"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: SmartBlanketProWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jinghe.smartblanket.pro
        PRODUCT_NAME: SmartBlanketPro
        CODE_SIGN_STYLE: Automatic

  SmartBlanketProWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets/SmartBlanketProLiveActivity
        excludes:
          - Info.plist
      - path: Sources/Shared
    settings:
      base:
        INFOPLIST_FILE: Widgets/SmartBlanketProLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jinghe.smartblanket.pro.LiveActivity
        PRODUCT_NAME: SmartBlanketProWidget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
